<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 2차 행복주택(SH) 계산기 — 소득·자산·배점·임대료</title>
<meta name="description" content="서울주택도시개발공사 2026년 2차 행복주택 입주자모집(2026.08.28 공고) 기준 소득자격·자산·우선공급 배점·임대료 전환 계산기">
<style>
  :root{
    --ink:#16233a;--ink-soft:#55617a;--line:#dfe3ec;--paper:#f7f6f2;--card:#fff;
    --seal:#b23a2e;--seal-soft:#f4e4e1;--gold:#b58a3c;--ok:#2f7d5b;--warn:#b07c1e;
    --shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px rgba(22,35,58,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:radial-gradient(1200px 400px at 100% -10%,#efe9df 0%,transparent 60%),var(--paper);
    color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  header{margin-bottom:22px}
  .plate{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;font-weight:700;
    color:var(--seal);border:1.5px solid var(--seal);border-radius:2px;padding:4px 10px;background:var(--seal-soft)}
  h1{font-size:26px;line-height:1.25;margin:14px 0 6px;letter-spacing:-.02em;font-weight:800}
  h1 .accent{color:var(--seal)}
  .sub{color:var(--ink-soft);font-size:14px;margin:0}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 18px;background:#ecebe4;padding:5px;border-radius:12px}
  .tab{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;
    border-radius:8px;color:var(--ink-soft);background:transparent;transition:all .18s ease}
  .tab .n{display:block;font-size:9px;letter-spacing:.08em;opacity:.6;font-weight:800;margin-bottom:2px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .panel{display:none;animation:fade .25s ease}
  .panel[data-active="true"]{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  label.field{display:block;margin-bottom:16px}
  label.field:last-child{margin-bottom:0}
  .field .lab{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field .hint{color:var(--ink-soft);font-weight:500;font-size:12px}
  .stepper{display:flex;gap:8px;flex-wrap:wrap}
  .stepper button{flex:1 1 44px;min-width:44px;cursor:pointer;border:1px solid var(--line);background:#fbfbf9;
    border-radius:9px;font:inherit;font-weight:700;font-size:13px;padding:9px 4px;color:var(--ink);transition:all .15s ease}
  .stepper button[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
  .stepper.wide button{flex:1 1 100px}
  input[type=number]{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;background:#fbfbf9;color:var(--ink)}
  input:focus,.stepper button:focus-visible,.tab:focus-visible,select:focus{outline:2px solid var(--seal);outline-offset:1px}
  select{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfbf9;color:var(--ink)}
  .inline{display:flex;align-items:center;gap:8px}
  .inline input{text-align:right}
  .unit{color:var(--ink-soft);font-weight:700;font-size:13px;white-space:nowrap}
  .result{border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .result .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft);text-transform:uppercase}
  .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
  .big small{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .verdict{font-size:14px;font-weight:700}
  .verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.no{color:var(--seal)}
  .bar{height:12px;border-radius:99px;background:#ececec;overflow:hidden;margin:12px 0 6px}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .barscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-weight:700}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:12px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft);font-weight:600}.kv .v{font-weight:800;text-align:right}
  .scorebreak{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .srow{display:flex;align-items:center;font-size:13px;gap:8px}
  .srow .sk{color:var(--ink-soft);font-weight:600;flex:1}
  .srow .sv{font-weight:800}
  .srow .sbar{flex:none;width:78px;height:7px;border-radius:99px;background:#ececec;overflow:hidden}
  .srow .sbar>span{display:block;height:100%;background:var(--gold)}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.55}
  .note strong{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:11.5px;font-weight:700;border:1px solid var(--line);background:#fbfbf9;border-radius:99px;padding:5px 10px;color:var(--ink-soft)}
  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.6;background:#fbfaf6;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .disclaimer b{color:var(--seal)}
  .backlink{display:block;text-align:center;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="plate" id="plateText">🏠 행복주택 청약 계산기</span>
    <h1>내 <span class="accent">소득·자산 자격</span>과<br>배점·임대료를 확인</h1>
    <p class="sub" id="subText"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="income"><span class="n">1</span>소득자격</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="asset"><span class="n">2</span>자산</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="score"><span class="n">3</span>배점</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="rent"><span class="n">4</span>임대료</button>
  </div>

  <!-- TAB1 소득자격 -->
  <section class="panel" data-tab="income" data-active="true">
    <div class="card">
      <label class="field">
        <span class="lab">어느 계층으로 신청하나요? <span class="hint">계층마다 소득·자산 기준이 다릅니다</span></span>
        <div class="stepper wide" id="tierPick"></div>
      </label>
      <label class="field">
        <span class="lab">가구원수 <span class="hint">(무주택세대구성원 전원 · 태아 포함)</span></span>
        <div class="stepper" id="hh"></div>
      </label>
      <label class="field" id="dualWrap">
        <span class="lab">맞벌이 여부 <span class="hint">배우자에게 근로·사업소득이 있으면 상한이 올라갑니다</span></span>
        <div class="stepper" id="dual">
          <button data-v="0" aria-pressed="true">외벌이</button>
          <button data-v="1">맞벌이</button>
        </div>
      </label>
      <label class="field">
        <span class="lab">출생자녀 가산 <span class="hint">2023.3.28 이후 출생·입양·태아 기준</span></span>
        <div class="stepper wide" id="birth">
          <button data-v="0" aria-pressed="true">해당 없음</button>
          <button data-v="1">이후 1명 (+10%p)</button>
          <button data-v="2">이후 2명↑ 또는 이후1명+이전1명↑ (+20%p)</button>
        </div>
      </label>
      <label class="field">
        <span class="lab">우리 가구 월평균 소득 <span class="hint">(세전 합산 / 만원)</span></span>
        <div class="inline"><input type="number" id="income" inputmode="numeric" value="400"><span class="unit">만원 / 월</span></div>
      </label>
    </div>
    <div class="result" id="incomeResult"></div>
    <div class="card">
      <p class="note" id="incomeNote"></p>
      <div class="chips" id="incomeChips"></div>
    </div>
  </section>

  <!-- TAB2 자산 -->
  <section class="panel" data-tab="asset" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">우리 세대 총자산 <span class="hint">(부동산+자동차+금융+일반자산 − 부채 / 만원)</span></span>
        <div class="inline"><input type="number" id="asset" inputmode="numeric" value="10000"><span class="unit">만원</span></div>
      </label>
      <label class="field">
        <span class="lab">보유 자동차 가액 <span class="hint">(보건복지부 차량기준가액 · 비영업용 승용 / 만원)</span></span>
        <div class="inline"><input type="number" id="car" inputmode="numeric" value="1500"><span class="unit">만원</span></div>
      </label>
    </div>
    <div class="result" id="assetResult"></div>
    <div class="card"><p class="note" id="assetNote"></p></div>
  </section>

  <!-- TAB3 배점 -->
  <section class="panel" data-tab="score" data-active="false">
    <div class="card">
      <p class="note" style="margin-bottom:14px" id="scoreIntro"></p>
      <div id="scoreFields"></div>
    </div>
    <div class="result" id="scoreResult"></div>
    <div class="card"><p class="note" id="scoreNote"></p></div>
  </section>

  <!-- TAB4 임대료 -->
  <section class="panel" data-tab="rent" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">단지 선택 <span class="hint">신규 2개 · 재공급 60여 개</span></span>
        <select id="cx"></select>
      </label>
      <label class="field">
        <span class="lab">공급구분 <span class="hint">계층·주택형별 임대조건</span></span>
        <select id="ut"></select>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보증금 ↔ 월세 전환 <span class="hint" id="convHint"></span></span>
        <div class="inline"><span class="unit" style="min-width:74px">보증금 증액</span><input type="number" id="convUp" inputmode="numeric" value="0"><span class="unit">만원</span></div>
        <div class="inline" style="margin-top:10px"><span class="unit" style="min-width:74px">보증금 감액</span><input type="number" id="convDown" inputmode="numeric" value="0"><span class="unit">만원</span></div>
      </label>
    </div>
    <div class="result" id="rentResult"></div>
    <div class="card">
      <div class="kv"><span class="k">기준 임대보증금</span><span class="v" id="baseDeposit">—</span></div>
      <div class="kv"><span class="k">기준 월임대료</span><span class="v" id="baseRent">—</span></div>
      <div class="kv"><span class="k">조정 후 보증금</span><span class="v" id="finalDeposit">—</span></div>
      <div class="kv"><span class="k">조정 후 월임대료</span><span class="v" id="finalRent">—</span></div>
      <div class="kv"><span class="k">계약금(보증금 20%)</span><span class="v" id="downpay">—</span></div>
      <div class="kv"><span class="k">잔금(보증금 80%)</span><span class="v" id="balance">—</span></div>
      <div class="kv"><span class="k">금회 모집호수</span><span class="v" id="cnt">—</span></div>
    </div>
    <div class="card"><p class="note" id="rentNote"></p></div>
  </section>

  <footer>
    <div class="disclaimer" id="disclaimer"></div>
    <a class="backlink" href="../">← 계산기 전체 모음</a>
  </footer>
</div>

   {n:"래미안베라힐즈(녹번1-2)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["청년(소득있음) 38㎡",132480,530000,65],["청년(소득없음) 38㎡",125120,500000,65],["신혼부부 43㎡",168400,674000,8]]},
   {n:"백련산SK VIEW IPARK(응암10)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["고령자 36㎡",104120,401000,17],["신혼부부 40㎡",123600,476000,8]]},
   {n:"백련산해모로(응암11)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["청년(소득있음) 39㎡",108360,431000,8],["청년(소득없음) 39㎡",102340,407000,8]]},
   {n:"DMC롯데캐슬더퍼스트(수색4)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["신혼부부 49㎡",176000,626000,13]]},
   {n:"힐스테이트녹번역(응암1)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["청년(소득있음) 39㎡",116520,406000,16],["청년(소득없음) 39㎡",110040,384000,16],["신혼부부 41㎡",137430,480000,4]]},
   {n:"DMC SK뷰(수색9)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["청년(소득있음) 38㎡",87510,320000,4],["청년(소득없음) 38㎡",82650,303000,4]]},
   {n:"DMC센트럴자이(증산2)_서울리츠2호",g:"은평구",o:"r",s:0,u:[["신혼부부 39㎡",99740,365000,12]]},
   {n:"은뜨락(서울리츠1호)",g:"은평구",o:"r",s:0,u:[["청년(소득있음) 39㎡",97200,389000,66],["청년(소득없음) 39㎡",91800,367000,66],["신혼부부 44㎡",121600,486000,5],["고령자 39S㎡",102600,410000,3]]},
   {n:"우디안4단지",g:"중랑구",o:"sh",s:0,u:[["주거급여수급자 21㎡",33600,140000,46]]},
   {n:"사가정센트럴아이파크",g:"중랑구",o:"sh",s:0,u:[["고령자 59㎡",152760,547000,5]]}
  ]
};
/* ===================== PARAMS 끝 ===================== */

(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  function wonText(won){
    const m=won/10000, eok=Math.floor(m/10000), rest=Math.round(m%10000);
    if(eok>0) return eok+"억 "+(rest>0? comma(rest)+"만원":"");
    return comma(Math.round(m))+"만원";
  }

  $("subText").textContent = "SH 2026년 2차 공고(2026.08.28) 기준 · 총 1,484호 · 청약 "+PARAMS.schedule.apply;
  $("disclaimer").innerHTML = "<b>안내</b> · 기준 수치는 <b>서울주택도시개발공사 2026년 2차 행복주택 입주자모집공고</b>("
    + PARAMS.source + ") 원문 기준입니다. 행복주택은 <b>분양전환되지 않는 공공임대주택</b>이며, "
    + "소득·자산은 사회보장정보시스템 조회 결과를 기준으로 판정되므로 공고일이 아닌 조회 시점 자료가 적용될 수 있습니다. "
    + "본 계산은 참고용 추정치이니 최종 판단은 <b>SH 인터넷청약시스템(www.i-sh.co.kr/app)</b>의 공고문 원문으로 확인하세요.";

  const tabs=document.querySelectorAll(".tab"), panels=document.querySelectorAll(".panel");
  tabs.forEach(t=>t.addEventListener("click",()=>{
    tabs.forEach(x=>x.setAttribute("aria-selected",x===t?"true":"false"));
    panels.forEach(p=>p.setAttribute("data-active",p.dataset.tab===t.dataset.tab?"true":"false"));
  }));
  function stepper(id,cb){
    const box=$(id); if(!box) return;
    box.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      cb(b.dataset.v);
    });
  }

  /* ===== 상태 ===== */
  let tier="youth", hh=1, dual=0, birth=0;

  const tierKeys=Object.keys(PARAMS.tiers);
  $("tierPick").innerHTML = tierKeys.map(k=>`<button data-v="${k}"${k===tier?' aria-pressed="true"':''}>${PARAMS.tiers[k].name}</button>`).join("");
  $("hh").innerHTML = PARAMS.hhKeys.map(n=>`<button data-v="${n}"${n===hh?' aria-pressed="true"':''}>${n}인${n===7?"↑":""}</button>`).join("");

  stepper("tierPick",v=>{tier=v;syncTier();renderAll();});
  stepper("hh",v=>{hh=+v;renderIncome();});
  stepper("dual",v=>{dual=+v;renderIncome();});
  stepper("birth",v=>{birth=+v;renderIncome();renderAsset();});
  $("income").addEventListener("input",renderIncome);
  ["asset","car"].forEach(id=>$(id).addEventListener("input",renderAsset));

  function syncTier(){ $("dualWrap").style.display = PARAMS.tiers[tier].dual ? "block" : "none"; }

  /* ===== TAB1 소득자격 ===== */
  // 적용 % 행 결정: 기본 100(신혼 맞벌이는 120) + 출생자녀 가산 10%p 단위
  function rowPct(){
    const t=PARAMS.tiers[tier];
    if(t.incomeBase===null) return null;
    let base = (t.dual && dual) ? 120 : 100;
    return base + birth*10;
  }
  function capFor(pct,n){
    const row=PARAMS.incomeRows[pct]; if(!row) return null;
    if(n<=5) return row[n]||null;
    if(!row[5]) return null;
    return row[5] + (n-5)*row.add;
  }
  function renderIncome(){
    const t=PARAMS.tiers[tier];
    const chips=[];
    if(t.incomeBase===null){
      $("incomeResult").innerHTML =
        `<div class="eyebrow">${t.name} 계층 · 소득 상한</div>`
        +`<div class="big">별도 기준 없음</div>`
        +`<div class="verdict ok">주거급여수급자 자격으로 판정</div>`
        +`<div class="note" style="margin-top:10px">공고일(2026.08.28) 기준 주거급여수급자증명서를 보유한 무주택세대구성원만 신청할 수 있습니다.</div>`;
      $("incomeNote").innerHTML = t.incomeNote;
      $("incomeChips").innerHTML = `<span class="chip">${t.max}</span><span class="chip">우디안4단지 21㎡ 46호</span>`;
      return;
    }
    const pct=rowPct(), cap=capFor(pct,hh);
    const incWon=(+$("income").value||0)*10000;
    if(cap===null){
      $("incomeResult").innerHTML =
        `<div class="eyebrow">${hh}인 가구 · 적용 ${pct}% 기준</div>`
        +`<div class="big">해당 없음</div>`
        +`<div class="verdict warn">공고 표에 이 조합의 금액이 없습니다</div>`
        +`<div class="note" style="margin-top:10px">출생자녀 가산은 그 자녀가 가구원수에 포함되므로 1~2인 가구와는 조합되지 않습니다. 가구원수를 다시 확인해 주세요.</div>`;
      $("incomeNote").innerHTML = t.incomeNote;
      $("incomeChips").innerHTML = "";
      return;
    }
    const pass = incWon>0 && incWon<=cap;
    const fill = Math.min(100, cap? incWon/cap*100 : 0);
    let verdict,cls;
    if(incWon<=0){verdict="소득을 입력하세요";cls="";}
    else if(pass){verdict="✓ "+t.name+" 계층 소득자격 통과";cls="ok";}
    else{verdict="✗ 소득 상한 초과 — 신청 불가";cls="no";}
    $("incomeResult").innerHTML=
      `<div class="eyebrow">${t.name} · ${hh}인 가구 · 적용 ${pct}% 기준</div>`
      +`<div class="big">${wonText(cap)} <small>/ 월</small></div>`
      +`<div class="verdict ${cls}">${verdict}</div>`
      +`<div class="bar"><span style="width:${fill.toFixed(0)}%;background:${pass?"var(--ok)":"var(--seal)"}"></span></div>`
      +`<div class="barscale"><span>0</span><span>내 소득 ${wonText(incWon)}</span><span>상한 ${wonText(cap)}</span></div>`;
    chips.push(`<span class="chip">${t.max}</span>`);
    if(hh===1) chips.push(`<span class="chip">1인 가구 +20%p 반영됨</span>`);
    if(hh===2) chips.push(`<span class="chip">2인 가구 +10%p 반영됨</span>`);
    if(t.dual&&dual) chips.push(`<span class="chip">맞벌이 120% 적용</span>`);
    if(birth) chips.push(`<span class="chip">출생자녀 +${birth*10}%p</span>`);
    if(hh>=6) chips.push(`<span class="chip">6인↑ 1인당 가산액 합산</span>`);
    $("incomeChips").innerHTML = chips.join("");
    $("incomeNote").innerHTML = t.incomeNote;
  }

  /* ===== TAB2 자산 ===== */
  function renderAsset(){
    const t=PARAMS.tiers[tier];
    if(!t.asset){
      $("assetResult").innerHTML =
        `<div class="eyebrow">${t.name} 계층 · 자산 기준</div>`
        +`<div class="big">별도 기준 없음</div>`
        +`<div class="verdict ok">수급자 자격으로 갈음</div>`;
      $("assetNote").innerHTML = "공고문 4-6에는 주거급여수급자 계층에 대한 총자산·자동차 상한이 별도로 제시되어 있지 않습니다. 다만 무주택세대구성원 요건은 그대로 적용됩니다.";
      return;
    }
    const totalCap=t.asset[birth], carCap=t.car[birth];
    const asset=(+$("asset").value||0)*10000, car=(+$("car").value||0)*10000;
    const passA=asset<=totalCap;
    const passC=t.carNone ? car<=0 : car<=carCap;
    const pass=passA&&passC;
    $("assetResult").innerHTML=
      `<div class="eyebrow">${t.name} 계층 자산 기준 (출생자녀 가산 ${PARAMS.birthLabel[birth]})</div>`
      +`<div class="big">${pass?"✓ 통과":"✗ 초과"}</div>`
      +`<div class="verdict ${pass?"ok":"no"}">총자산 ${passA?"통과":"초과"} · 자동차 ${passC?"통과":"초과"}</div>`
      +`<div class="note" style="margin-top:10px">총자산 상한 <strong>${wonText(totalCap)}</strong> / 자동차 기준 <strong>${t.carNone?"보유 불가(산출대상 자동차 미소유)":wonText(carCap)}</strong>.<br>
        입력값: 총자산 ${wonText(asset)}, 자동차 ${wonText(car)}.</div>`;
    $("assetNote").innerHTML = "총자산은 부동산·자동차·금융자산·일반자산을 합산한 금액에서 <strong>부채를 차감</strong>해 산출합니다. "
      + "마이너스통장 대출, 신용카드 연체대금, 개인 간 거래는 부채로 인정되지 않습니다. "
      + "총자산 기준을 통과해도 <strong>자동차 가액 기준을 따로 충족</strong>해야 하며, "
      + "장애인사용 자동차와 국가유공자(상이 1~7급) 보철용 차량은 자동차 가액 산출에서 제외됩니다. "
      + (t.carNone ? "대학생 계층은 본인이 자동차 가액 산출대상 자동차를 <strong>소유하고 있지 않아야</strong> 합니다." : "");
  }

  /* ===== TAB3 배점 ===== */
  function buildScore(){
    const sc=PARAMS.score[tier];
    $("scoreIntro").innerHTML = sc.intro;
    $("scoreNote").innerHTML = sc.note + " 공고문 전 계층 공통으로 <strong>2세 미만 자녀(2024.8.28 이후 출생·태아·입양)가 있는 신청자가 우선공급에서 가장 먼저</strong> 선정되며, 그 인원이 모집 인원을 넘으면 무작위 추첨합니다.";
    $("scoreFields").innerHTML = sc.items.map(it=>{
      const opts=it.options.map((o,i)=>`<option value="${o.points}"${i===0?" selected":""}>${o.label} — ${o.points}점</option>`).join("");
      const hint=it.hint?`<span class="hint">${it.hint}</span>`:"";
      return `<label class="field"><span class="lab">${it.label} ${hint}</span><select data-key="${it.key}">${opts}</select></label>`;
    }).join("");
    $("scoreFields").querySelectorAll("select").forEach(s=>s.addEventListener("change",renderScore));
  }
  function renderScore(){
    const sc=PARAMS.score[tier], items=sc.items;
    const max=items.reduce((s,it)=>s+Math.max(...it.options.map(o=>o.points)),0);
    const selects=$("scoreFields").querySelectorAll("select");
    let total=0; const rows=[];
    selects.forEach((s,i)=>{const p=+s.value;total+=p;rows.push([items[i].label,p,Math.max(...items[i].options.map(o=>o.points))]);});
    const pctFull=max? total/max*100 : 0;
    const grade=pctFull>=100?["만점 — 동점자 다수 예상, 추첨 대비","ok"]:pctFull>=60?["중상위권","warn"]:["하위권 — 상향 여지 있음","no"];
    const breakdown=rows.map(r=>`<div class="srow"><span class="sk">${r[0]}</span><span class="sbar"><span style="width:${r[2]?r[1]/r[2]*100:0}%"></span></span><span class="sv">${r[1]} / ${r[2]}</span></div>`).join("");
    $("scoreResult").innerHTML=
      `<div class="eyebrow">${PARAMS.tiers[tier].name} 우선공급 예상 배점</div>`
      +`<div class="big">${total} <small>/ ${max}점</small></div>`
      +`<div class="verdict ${grade[1]}">${grade[0]}</div>`
      +`<div class="scorebreak">${breakdown}</div>`;
  }

  /* ===== TAB4 임대료 ===== */
  $("cx").innerHTML = PARAMS.units.map((c,i)=>`<option value="${i}">${c.s?"[신규] ":""}${c.g} · ${c.n}</option>`).join("");
  let ci=0, ui=0;
  function buildUnits(){
    const c=PARAMS.units[ci];
    $("ut").innerHTML = c.u.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join("");
    ui=0;
  }
  $("cx").addEventListener("change",()=>{ci=+$("cx").value;buildUnits();$("convUp").value=0;$("convDown").value=0;renderRent();});
  $("ut").addEventListener("change",()=>{ui=+$("ut").value;$("convUp").value=0;$("convDown").value=0;renderRent();});
  ["convUp","convDown"].forEach(id=>$(id).addEventListener("input",renderRent));

  function renderRent(){
    const c=PARAMS.units[ci], u=c.u[ui];
    const R=PARAMS.rentRule;
    const cap = (c.o==="r" ? R.capREITS : R.capSH)/100;
    const baseDep = u[1]*1000, baseRent = u[2];
    const maxUp   = baseRent*cap*12/(R.upRate/100);   // 월임대료 → 보증금 전환 한도(원)
    const maxDown = baseDep*cap;                      // 보증금 → 월임대료 전환 한도(원)
    let up=(+$("convUp").value||0)*10000, down=(+$("convDown").value||0)*10000;
    let warn="";
    if(up>maxUp){ up=maxUp; warn+=`증액은 최대 ${wonText(maxUp)}까지만 가능해 한도로 계산했습니다. `; }
    if(down>maxDown){ down=maxDown; warn+=`감액은 최대 ${wonText(maxDown)}까지만 가능해 한도로 계산했습니다. `; }
    const deposit = baseDep + up - down;
    let rent = baseRent - up*(R.upRate/100)/12 + down*(R.downRate/100)/12;
    if(rent<0) rent=0;
    rent = Math.floor(rent/100)*100;

    $("convHint").textContent = (c.o==="r"?"서울리츠 소유 — 기준액의 20%까지":"SH·서울시 소유 — 기준액의 50%까지");
    $("rentResult").innerHTML=
      `<div class="eyebrow">${u[0]} · 조정 후 월 부담</div>`
      +`<div class="big">${comma(rent)}<small> 원 / 월</small></div>`
      +`<div class="verdict ok">보증금 ${wonText(deposit)}</div>`
      +`<div class="note" style="margin-top:10px">${warn}보증금 증액 한도 <strong>${wonText(maxUp)}</strong> · 감액 한도 <strong>${wonText(maxDown)}</strong>
         (${c.o==="r"?"서울리츠1·2호 소유 단지는 20%":"SH·서울시 소유 단지는 50%"}).</div>`;
    $("baseDeposit").textContent=wonText(baseDep);
    $("baseRent").textContent=comma(baseRent)+"원";
    $("finalDeposit").textContent=wonText(deposit);
    $("finalRent").textContent=comma(rent)+"원";
    $("downpay").textContent=wonText(baseDep*R.depositPct/100);
    $("balance").textContent=wonText(baseDep*(100-R.depositPct)/100);
    $("cnt").textContent=u[3]+"호";
    $("rentNote").innerHTML = "월임대료를 보증금으로 전환할 때 이율은 <strong>연 6.0%</strong>, 보증금을 월임대료로 전환할 때는 <strong>연 2.5%</strong>입니다(한국은행 기준금리에 따라 변동 가능). "
      + "전환은 계약 체결 후 100만원 단위로 신청하며, <strong>한 번 전환하면 1년 이내에는 다시 신청할 수 없습니다.</strong> "
      + "계약금은 임대보증금의 20%, 잔금은 80%입니다. 표시 금액은 단지 내 대표 면적 기준이라 실제 배정된 동·호와 다소 차이가 날 수 있습니다.";
  }

  /* ===== 초기 렌더 ===== */
  function renderAll(){ renderIncome(); renderAsset(); buildScore(); renderScore(); }
  syncTier(); buildUnits(); renderAll(); renderRent();
})();
</script>
