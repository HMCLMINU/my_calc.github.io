<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 SH 국민임대 계산기</title>
<style>
  :root{
    --ink:#16233a;--ink-soft:#55617a;--line:#dfe3ec;--paper:#f7f6f2;--card:#fff;
    --seal:#b23a2e;--seal-soft:#f4e4e1;--gold:#b58a3c;--ok:#2f7d5b;--warn:#b07c1e;
    --shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px rgba(22,35,58,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:radial-gradient(1200px 400px at 100% -10%,#efe9df 0%,transparent 60%),var(--paper);
    color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  header{margin-bottom:22px}
  .plate{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;font-weight:700;
    color:var(--seal);border:1.5px solid var(--seal);border-radius:2px;padding:4px 10px;background:var(--seal-soft)}
  h1{font-size:26px;line-height:1.25;margin:14px 0 6px;letter-spacing:-.02em;font-weight:800}
  h1 .accent{color:var(--seal)}
  .sub{color:var(--ink-soft);font-size:14px;margin:0}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 18px;background:#ecebe4;padding:5px;border-radius:12px}
  .tab{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;
    border-radius:8px;color:var(--ink-soft);background:transparent;transition:all .18s ease}
  .tab .n{display:block;font-size:9px;letter-spacing:.08em;opacity:.6;font-weight:800;margin-bottom:2px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .panel{display:none;animation:fade .25s ease}
  .panel[data-active="true"]{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  label.field{display:block;margin-bottom:16px}
  label.field:last-child{margin-bottom:0}
  .field .lab{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field .hint{color:var(--ink-soft);font-weight:500;font-size:12px}
  .stepper{display:flex;gap:8px;flex-wrap:wrap}
  .stepper button{flex:1 1 44px;min-width:44px;cursor:pointer;border:1px solid var(--line);background:#fbfbf9;
    border-radius:9px;font:inherit;font-weight:700;font-size:13px;padding:9px 4px;color:var(--ink);transition:all .15s ease}
  .stepper button[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
  .stepper.col{flex-direction:column}
  .stepper.col button{text-align:left;padding:11px 13px}
  input[type=number]{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;background:#fbfbf9;color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--seal)}
  input:focus,.stepper button:focus-visible,.tab:focus-visible,select:focus{outline:2px solid var(--seal);outline-offset:1px}
  select{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfbf9;color:var(--ink)}
  .inline{display:flex;align-items:center;gap:8px}
  .inline input{text-align:right}
  .unit{color:var(--ink-soft);font-weight:700;font-size:13px;white-space:nowrap}
  .result{border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .result .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft);text-transform:uppercase}
  .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
  .big small{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .verdict{font-size:14px;font-weight:700}
  .verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.no{color:var(--seal)}
  .bar{height:12px;border-radius:99px;background:#ececec;overflow:hidden;margin:12px 0 6px}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .barscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-weight:700}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft);font-weight:600}.kv .v{font-weight:800;text-align:right}
  .scorebreak{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .srow{display:flex;align-items:center;font-size:13px;gap:8px}
  .srow .sk{color:var(--ink-soft);font-weight:600;flex:1}
  .srow .sv{font-weight:800;white-space:nowrap}
  .srow .sbar{flex:none;width:70px;height:7px;border-radius:99px;background:#ececec;overflow:hidden}
  .srow .sbar>span{display:block;height:100%;background:var(--gold)}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.55}
  .note strong{color:var(--ink)}
  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .links{font-size:12.5px;line-height:1.9;margin-bottom:14px}
  .links a{color:var(--seal);font-weight:700;text-decoration:none}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.6;background:#fbfaf6;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .disclaimer b{color:var(--seal)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="plate" id="plateText">🏠 국민임대 청약 계산기</span>
    <h1>2026년 SH 국민임대<br><span class="accent">소득·자산·배점·임대료</span> 확인</h1>
    <p class="sub" id="subText"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="income"><span class="n">1</span>소득자격</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="asset"><span class="n">2</span>자산</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="score"><span class="n">3</span>배점</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="rent"><span class="n">4</span>임대료</button>
  </div>

  <!-- TAB1 소득자격 -->
  <section class="panel" data-tab="income" data-active="true">
    <div class="card">
      <label class="field">
        <span class="lab">가구원수 <span class="hint">(무주택세대구성원 전원·태아 포함)</span></span>
        <div class="stepper" id="hh"></div>
      </label>
      <label class="field">
        <span class="lab">출산자녀 <span class="hint">(2023.3.28 이후 출생·입양·태아 / 소득·자산 가산)</span></span>
        <div class="stepper" id="birth">
          <button data-v="0" aria-pressed="true">없음</button>
          <button data-v="1">1명</button>
          <button data-v="2">2명 이상</button>
        </div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">우리 세대 월평균 소득 <span class="hint">(세전 합산 / 만원)</span></span>
        <div class="inline"><input type="number" id="income" inputmode="numeric" value="400"><span class="unit">만원 / 월</span></div>
      </label>
    </div>
    <div class="card">
      <label class="field" style="margin-bottom:0">
        <span class="lab">어느 순위로 신청하나요? <span class="hint">면적·순위마다 소득 상한이 다릅니다</span></span>
        <div class="stepper col" id="tierPick">
          <button data-v="pri" aria-pressed="true">50㎡ 미만 · 선순위 (소득 50%↓)</button>
          <button data-v="gen">50㎡ 미만 · 후순위 (50% 초과~70%↓)</button>
          <button data-v="large">50~60㎡(59형) (소득 70%↓)</button>
        </div>
      </label>
    </div>
    <div class="result" id="incomeResult"></div>
    <div class="card">
      <p class="note" id="tierNote"></p>
      <div class="note" id="addNote" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- TAB2 자산 -->
  <section class="panel" data-tab="asset" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">우리 세대 총자산 <span class="hint">(부동산+금융+기타 − 부채 / 만원)</span></span>
        <div class="inline"><input type="number" id="asset" inputmode="numeric" value="20000"><span class="unit">만원</span></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보유 자동차 가액 <span class="hint">(비영업용 승용차 중 최고가 1대 / 만원)</span></span>
        <div class="inline"><input type="number" id="car" inputmode="numeric" value="2000"><span class="unit">만원</span></div>
      </label>
    </div>
    <div class="result" id="assetResult"></div>
    <div class="card"><p class="note" id="assetNote"></p></div>
  </section>

  <!-- TAB3 배점 -->
  <section class="panel" data-tab="score" data-active="false">
    <div class="card">
      <label class="field" style="margin-bottom:14px">
        <span class="lab">배점표 종류</span>
        <div class="stepper" id="scoreKind">
          <button data-v="gen" aria-pressed="true">일반공급</button>
          <button data-v="weak">주거약자용</button>
        </div>
      </label>
      <p class="note" id="scoreIntro" style="margin-bottom:14px"></p>
      <div id="scoreFields"></div>
    </div>
    <div class="result" id="scoreResult"></div>
    <div class="card"><p class="note" id="scoreNote"></p></div>
  </section>

  <!-- TAB4 임대료 -->
  <section class="panel" data-tab="rent" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">단지 선택 <span class="hint">(자치구별)</span></span>
        <select id="cx"></select>
      </label>
      <label class="field">
        <span class="lab">신청 유형(전용면적)</span>
        <div class="stepper" id="unit"></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보증금 ↔ 월세 상호전환 <span class="hint">(계약체결 후 신청 / 100만원 단위)</span></span>
        <div class="stepper" id="convDir" style="margin-bottom:10px">
          <button data-v="0" aria-pressed="true">기본조건</button>
          <button data-v="up">보증금↑ 월세↓</button>
          <button data-v="down">보증금↓ 월세↑</button>
        </div>
        <input type="range" id="convPct" min="0" max="60" step="5" value="60">
        <div class="barscale"><span>0%</span><span id="convPctLabel">60%</span><span>최대 60%</span></div>
      </label>
    </div>
    <div class="result" id="rentResult"></div>
    <div class="card">
      <div class="kv"><span class="k">기본 임대보증금</span><span class="v" id="baseDeposit">—</span></div>
      <div class="kv"><span class="k">기본 월임대료</span><span class="v" id="baseRent">—</span></div>
      <div class="kv"><span class="k">전환 후 보증금</span><span class="v" id="finalDeposit">—</span></div>
      <div class="kv"><span class="k">전환 후 월임대료</span><span class="v" id="finalRent">—</span></div>
      <div class="kv"><span class="k">계약금(보증금 20%)</span><span class="v" id="downpay">—</span></div>
      <div class="kv"><span class="k">잔금(입주 시 80%)</span><span class="v" id="balance">—</span></div>
    </div>
    <div class="card"><p class="note" id="rentNote"></p></div>
  </section>

  <footer>
    <div class="links">
      🔗 <a href="../">계산기 전체 모음</a><br>
      🔗 <a href="../policy/">전월세·정책대출 및 부동산 규제 총정리</a>
    </div>
    <div class="disclaimer" id="disclaimer"></div>
  </footer>
</div>

<script>
/* ============================================================
   PARAMS — 2026년 SH(서울주택도시개발공사) 국민임대주택 입주자모집공고
   주택관리번호 2026-000379 / 모집공고일 2026.08.20. 원문 기준.
   국민임대는 분양전환되지 않는 30년 이상 장기공공임대.

const PARAMS = {

  source: "SH 서울주택도시개발공사 2026년 국민임대주택 입주자모집공고(2026.08.20., 관리번호 2026-000379)",

  // 2025년도 도시근로자 가구원수별 가구당 월평균소득(원). 공고 25p 표 및 26~31p 선정표 원문 그대로.
  // 50㎡미만 선순위: 3인이상 50% / 2인 60% / 1인 70%
  // 50㎡미만 후순위 및 59㎡: 3인이상 70% / 2인 80% / 1인 90%
  // 출산자녀(2023.3.28 이후) 1명 +10%p, 2명 이상(또는 1명+이전자녀) +20%p → 공고 표의 확정 금액을 그대로 사용.
  incomeTable: {
    hhKeys: [1,2,3,4,5,6],
    // [출산자녀 0명, 1명, 2명이상] 순서. null = 공고 표에 금액 미표기(해당 조합 사실상 성립 불가).
    pri: {
      1: [2669354, null,    null],
      2: [3519762, 4106389, null],
      3: [4084215, 4901057, 5717900],
      4: [4401101, 5281321, 6161541],
      5: [4663493, 5596191, 6528890],
      6: [4953132, 5943758, 6934384]
    },
    gen: {
      1: [3432027, null,    null],
      2: [4693016, 5279643, null],
      3: [5717900, 6534743, 7351586],

      5: [6528890, 7461588, 8394287],
      6: [6934384, 7925010, 8915637]
    },
    tierLabel: { pri:"50㎡미만 선순위", gen:"50㎡미만 후순위", large:"59형(50~60㎡)" },
    tierRatio: { pri:"3인 이상 50% (1인 70%·2인 60%)", gen:"3인 이상 70% (1인 90%·2인 80%)", large:"3인 이상 70% (1인 90%·2인 80%)" }
  },

  // 자산기준(원). 공고 25p. 출산자녀 가산 10%p/20%p.
  assetTable: {
    total: { 0:345000000, 1:379000000, 2:413000000 },
    car:   { 0:45420000,  1:49960000,  2:54510000 }
  },

  // 배점표. 공고 33p(일반공급) / 32p(주거약자용).
  score: {
    gen: {
      intro: "일반공급 동일순위 경쟁 시 배점입니다. 미성년 자녀 3명 이상인 신청자를 자녀 수 많은 순으로 먼저 선정하고, 그 다음 배점 합산 순위로 정합니다. 동점이면 전산추첨.",

        { key:"family", label:"부양가족수", hint:"태아 포함·신청자 제외", options:[

          {label:"5년 이상 (2021.08.20. 이전 전입)",points:3},
          {label:"3년 이상 5년 미만",points:2},
          {label:"1년 이상 3년 미만",points:1},

        { key:"const", label:"건설근로자", hint:"1년 이상 퇴직공제부금 적립 또는 피보험자격 이력", options:[

        { key:"weak", label:"사회취약계층", hint:"생계·의료급여, 한부모, 국가유공자, 차상위 등 1개 항목만 인정", options:[
          {label:"해당 없음",points:0},{label:"해당 (3점)",points:3}]},
        { key:"minus", label:"국민임대 계약 이력 감점", hint:"2011.11.04. 이후 계약자", options:[
          {label:"해당 없음",points:0},{label:"공고일 기준 5년 이내 계약 (-3점)",points:-3},
          {label:"공고일 기준 3년 이내 계약 (-5점)",points:-5}]}
      ]
    },
    weak: {
      intro: "주거약자용 주택(고령자·장애인·국가유공자 등) 배점입니다. 저층(1~3층)에 배치되며 주거약자 자격자만 신청할 수 있습니다. 일반공급으로 신청하면 주거약자주택으로는 공급되지 않습니다.",
      items: [
        { key:"family", label:"부양가족수", hint:"태아 포함·신청자 제외", options:[
          {label:"3인 이상",points:3},{label:"2인",points:2},{label:"1인",points:1},{label:"0인",points:0}]},
        { key:"resid", label:"서울시 연속거주기간", hint:"만19세 이후", options:[

  function curSet(){return PARAMS.score[kind];}
  function tierMax(){return curSet().items.reduce((s,it)=>s+Math.max(...it.options.map(o=>o.points)),0);}
  function buildScore(){
    const set=curSet();
    $("scoreIntro").innerHTML = set.intro;
    $("scoreFields").innerHTML = set.items.map(it=>{
      const opts=it.options.map((o,i)=>`<option value="${o.points}"${i===0?" selected":""}>${o.label}${o.points>0?" — "+o.points+"점":""}</option>`).join("");
      const hint=it.hint?`<span class="hint">${it.hint}</span>`:"";
      return `<label class="field"><span class="lab">${it.label} ${hint}</span><select data-key="${it.key}">${opts}</select></label>`;
    }).join("");
    $("scoreFields").querySelectorAll("select").forEach(s=>s.addEventListener("change",renderScore));
    $("scoreNote").innerHTML = kind==="gen"
      ? "국민임대 자체 배점표이며 민영주택 84점 가점제와 다릅니다. 신청서에 <strong>본인이 직접 기재한 값</strong>을 기준으로 모집세대수의 200% 내외를 서류심사 대상자로 뽑고, 이후 서류로 검증합니다. 사실보다 유리하게 적으면 감점·결격·당첨취소가 되고, 불리하게 적어도 나중에 올려주지 않습니다."
      : "주거약자용 주택은 욕실 미닫이문·단차 제거·낮은 스위치 등을 갖춘 저층 주택으로, 고령자(만65세 이상)·장애인·국가유공자 등만 신청할 수 있습니다. 일반공급으로 신청하면 주거약자 자격이 있어도 주거약자주택으로 공급되지 않으니 청약 단계에서 유형을 정확히 골라야 합니다.";
  }
  function renderScore(){
    const set=curSet(), items=set.items, max=tierMax();
    const selects=$("scoreFields").querySelectorAll("select");
    let total=0; const rows=[];
    selects.forEach((s,i)=>{const p=+s.value;total+=p;rows.push([items[i].label,p,Math.max(...items[i].options.map(o=>o.points))]);});
    const pctFull=Math.max(0,total)/max*100;
    const grade=pctFull>=70?["상위권","ok"]:pctFull>=40?["중위권 — 동점 추첨 대비","warn"]:["하위권 — 상향 여지 큼","no"];
    const breakdown=rows.filter(r=>r[2]>0).map(r=>`<div class="srow"><span class="sk">${r[0]}</span><span class="sbar"><span style="width:${Math.max(0,r[1])/r[2]*100}%"></span></span><span class="sv">${r[1]} / ${r[2]}</span></div>`).join("");
    const minusRow=rows.find(r=>r[2]<=0 && r[1]<0);
    $("scoreResult").innerHTML=
      `<div class="eyebrow">${kind==="gen"?"일반공급":"주거약자용"} 예상 배점</div>`
      +`<div class="big">${total} <small>/ ${max}점</small></div>`
      +`<div class="verdict ${grade[1]}">${grade[0]}${minusRow?` · 감점 ${minusRow[1]}점 반영`:""}</div>`
      +`<div class="scorebreak">${breakdown}</div>`;
  }

  // ===== TAB4 임대료 =====
  const CX=PARAMS.rent.complexes;
  (function buildSelect(){
    let html="", lastGu="";
    CX.forEach((c,i)=>{
      if(c.gu!==lastGu){ if(lastGu) html+="</optgroup>"; html+=`<optgroup label="${c.gu}">`; lastGu=c.gu; }
      html+=`<option value="${i}">${c.name}</option>`;
    });
    html+="</optgroup>";
    $("cx").innerHTML=html;
  })();
  let cxIdx=0, unit=null, dir="0", convPct=60;
  $("cx").addEventListener("change",()=>{cxIdx=+$("cx").value;buildUnits();renderRent();});
  stepper("convDir",v=>{dir=v;renderRent();});
  $("convPct").addEventListener("input",()=>{convPct=+$("convPct").value;$("convPctLabel").textContent=convPct+"%";renderRent();});
  function buildUnits(){
    const keys=Object.keys(CX[cxIdx].units);
    unit=keys[0];
    $("unit").innerHTML=keys.map((k,i)=>`<button data-v="${k}"${i===0?' aria-pressed="true"':''}>${k}형</button>`).join("");
  }
  $("unit").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    $("unit").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    unit=b.dataset.v; renderRent();
  });
  function renderRent(){
    const c=CX[cxIdx], u=c.units[unit];
    const dep0=u.d[0], rent0=u.r[0];
    const isRange = u.d[0]!==u.d[1];
    const p=convPct/100;
    let dep=dep0, rent=rent0, headline="";
    if(dir==="up"){                     // 월임대료 → 보증금 (이율 6.7%)
      const cut=rent0*p;
      rent=rent0-cut;
      dep=dep0+cut*12/(PARAMS.rent.rentToDepRate/100);
      headline=`월임대료의 ${convPct}%를 보증금으로 전환`;
    }else if(dir==="down"){             // 보증금 → 월임대료 (이율 2.5%)
      const cut=dep0*p;
      dep=dep0-cut;
      rent=rent0+cut*(PARAMS.rent.depToRentRate/100)/12;
      headline=`보증금의 ${convPct}%를 월임대료로 전환`;
    }else{
      headline="공고 기준 임대조건 (전환 없음)";
    }
    $("rentResult").innerHTML=
      `<div class="eyebrow">${unit}형 · ${headline}</div>`
      +`<div class="big">${comma(Math.round(rent/100)*100)}<small> 원 / 월</small></div>`
      +`<div class="verdict ok">보증금 ${wonText(dep)}</div>`
      +`<div class="note" style="margin-top:10px">`
      +(isRange? `이 지구는 단지·타입별로 임대조건이 <strong>${wonText(u.d[0])}~${wonText(u.d[1])} / 월 ${comma(u.r[0])}~${comma(u.r[1])}원</strong> 범위입니다. 위 계산은 <strong>최저 조건</strong> 기준이며, 지구단위 공급이라 전산추첨으로 단지·동호가 정해진 뒤 실제 금액이 확정됩니다.`
              : `공고에 단일 조건으로 표기된 단지입니다.`)
      +`</div>`;
    $("baseDeposit").textContent=wonText(dep0)+(isRange?` ~ ${wonText(u.d[1])}`:"");
    $("baseRent").textContent=comma(rent0)+"원"+(isRange?` ~ ${comma(u.r[1])}원`:"");
    $("finalDeposit").textContent=wonText(dep);
    $("finalRent").textContent=comma(Math.round(rent/100)*100)+"원";
    $("downpay").textContent=wonText(dep0*PARAMS.rent.contractPct/100);
    $("balance").textContent=wonText(dep0*(100-PARAMS.rent.contractPct)/100);
    $("rentNote").innerHTML="계약 시 <strong>기본 임대보증금의 20%</strong>를 계약금으로 내고 나머지 80%는 입주 시 냅니다. 상호전환은 <strong>계약 체결 후</strong> 주거안심종합센터에 신청하며 100만원 단위, 한 번 전환하면 1년 내 재신청 불가입니다. 전환 한도는 각각 60%이고 이율은 보증금→월세 2.5%, 월세→보증금 6.7%입니다(계약 시점 이율에 따라 변동 가능). 계약금·잔금은 전환 전 기본 보증금 기준으로 표시했으며, 전환 결과는 100원 단위 반올림이라 공고 표와 수백원 차이가 날 수 있습니다.";
  }

  buildUnits(); renderIncome(); renderAsset(); buildScore(); renderScore(); renderRent();
})();
</script>
