<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울공릉 신혼희망타운 행복주택 계산기</title>
<style>
  :root{
    --ink:#16233a;--ink-soft:#55617a;--line:#dfe3ec;--paper:#f7f6f2;--card:#fff;
    --seal:#b23a2e;--seal-soft:#f4e4e1;--gold:#b58a3c;--ok:#2f7d5b;--warn:#b07c1e;
    --s1:#2f6d8f;--s2:#5a8fa8;--s3:#94b3c4;
    --shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px rgba(22,35,58,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:radial-gradient(1200px 400px at 100% -10%,#efe9df 0%,transparent 60%),var(--paper);
    color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  header{margin-bottom:22px}
  .plate{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;font-weight:700;
    color:var(--seal);border:1.5px solid var(--seal);border-radius:2px;padding:4px 10px;background:var(--seal-soft)}
  h1{font-size:26px;line-height:1.25;margin:14px 0 6px;letter-spacing:-.02em;font-weight:800}
  h1 .accent{color:var(--seal)}
  .sub{color:var(--ink-soft);font-size:14px;margin:0}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 18px;background:#ecebe4;padding:5px;border-radius:12px}
  .tab{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;
    border-radius:8px;color:var(--ink-soft);background:transparent;transition:all .18s ease}
  .tab .n{display:block;font-size:9px;letter-spacing:.08em;opacity:.6;font-weight:800;margin-bottom:2px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .panel{display:none;animation:fade .25s ease}
  .panel[data-active="true"]{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  label.field{display:block;margin-bottom:16px}
  label.field:last-child{margin-bottom:0}
  .field .lab{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field .hint{color:var(--ink-soft);font-weight:500;font-size:12px}
  .stepper{display:flex;gap:8px;flex-wrap:wrap}
  .stepper button{flex:1 1 44px;min-width:44px;cursor:pointer;border:1px solid var(--line);background:#fbfbf9;
    border-radius:9px;font:inherit;font-weight:700;padding:9px 4px;color:var(--ink);transition:all .15s ease}
  .stepper button[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
  .stepper.stack{flex-direction:column}
  .stepper.stack button{flex:none;width:100%;text-align:left;padding:11px 13px}
  input[type=number]{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;background:#fbfbf9;color:var(--ink)}
  input:focus,.stepper button:focus-visible,.tab:focus-visible,select:focus{outline:2px solid var(--seal);outline-offset:1px}
  select{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfbf9;color:var(--ink)}
  .inline{display:flex;align-items:center;gap:8px}
  .inline input{text-align:right}
  .unit{color:var(--ink-soft);font-weight:700;font-size:13px;white-space:nowrap}
  .result{border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .result .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft);text-transform:uppercase}
  .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
  .big small{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .verdict{font-size:14px;font-weight:700}
  .verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.no{color:var(--seal)}
  .bar{height:12px;border-radius:99px;background:#ececec;overflow:hidden;margin:12px 0 6px}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .barscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:#f1efe8;color:var(--ink-soft)}
  .chip.on{background:var(--seal-soft);color:var(--seal)}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft);font-weight:600}.kv .v{font-weight:800}
  .scorebreak{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .srow{display:flex;align-items:center;font-size:13px;gap:8px}
  .srow .sk{color:var(--ink-soft);font-weight:600;flex:1}
  .srow .sv{font-weight:800}
  .srow .sbar{flex:none;width:78px;height:7px;border-radius:99px;background:#ececec;overflow:hidden}
  .srow .sbar>span{display:block;height:100%;background:var(--gold)}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.55}
  .note strong{color:var(--ink)}
  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.6;background:#fbfaf6;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .disclaimer b{color:var(--seal)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="plate" id="plateText">🏠 행복주택 청약 계산기</span>
    <h1>내 <span class="accent">소득·자산 자격</span>과<br>배점·임대료를 확인</h1>
    <p class="sub" id="subText"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="income"><span class="n">1</span>소득자격</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="asset"><span class="n">2</span>자산</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="score"><span class="n">3</span>배점·순위</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="rent"><span class="n">4</span>임대료</button>
  </div>

  <!-- TAB1 소득자격 -->
  <section class="panel" data-tab="income" data-active="true">
    <div class="card">
      <label class="field">
        <span class="lab">가구원수 <span class="hint">(태아 포함)</span></span>
        <div class="stepper" id="hh"></div>
      </label>
      <label class="field">
        <span class="lab">출산자녀 <span class="hint">(2023.3.28 이후 출생·입양·태아 / 최대 2자녀 인정)</span></span>
        <div class="stepper" id="birth">
          <button data-v="0" aria-pressed="true">없음</button>
          <button data-v="1">1인</button>
          <button data-v="2">2인 이상</button>
        </div>
      </label>
      <label class="field">
        <span class="lab">우리 가구 월평균 소득 <span class="hint">(세전 합산 / 만원)</span></span>
        <div class="inline"><input type="number" id="income" inputmode="numeric" value="600"><span class="unit">만원 / 월</span></div>
      </label>
    </div>
    <div class="card">
      <label class="field" style="margin-bottom:0">
        <span class="lab">어느 자격으로 신청하나요? <span class="hint">자격·맞벌이 여부에 따라 적용 소득기준(%)이 달라집니다</span></span>
        <div class="stepper stack" id="kindPick">
          <button data-v="single" aria-pressed="true">신혼부부·예비신혼부부 (외벌이)</button>
          <button data-v="dual">신혼부부·예비신혼부부 (맞벌이)</button>
          <button data-v="parent">한부모가족</button>
        </div>
      </label>
    </div>
    <div class="result" id="incomeResult"></div>
    <div class="card">
      <p class="note"><strong>선정 순서:</strong> 소득·자산 자격 통과 → 거주지 순위 → 경쟁 시 배점(우선공급·주거약자용) → 추첨. 일반공급은 배점 없이 <strong>순위 → 추첨</strong>입니다. 우선공급 물량 29호를 먼저 채우고, 탈락자는 별도 신청 없이 일반공급(30호)으로 자동 전환됩니다.</p>
      <div class="note" id="addNote" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- TAB2 자산 -->
  <section class="panel" data-tab="asset" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">우리 세대 총자산 <span class="hint">(부동산+금융+기타 − 부채 / 만원)</span></span>
        <div class="inline"><input type="number" id="asset" inputmode="numeric" value="20000"><span class="unit">만원</span></div>
      </label>
      <label class="field">
        <span class="lab">보유 자동차 가액 <span class="hint">(보건복지부 차량기준가액 / 만원)</span></span>
        <div class="inline"><input type="number" id="car" inputmode="numeric" value="2000"><span class="unit">만원</span></div>
      </label>
    </div>
    <div class="result" id="assetResult"></div>
    <div class="card"><p class="note" id="assetNote"></p></div>
  </section>

  <!-- TAB3 배점·순위 -->
  <section class="panel" data-tab="score" data-active="false">
    <div class="card">
      <label class="field" style="margin-bottom:0">
        <span class="lab">어느 트랙인가요?</span>
        <div class="stepper stack" id="trackPick"></div>
      </label>
    </div>
    <div class="card" id="scoreCard">
      <p class="note" id="scoreIntro" style="margin-bottom:14px"></p>
      <div id="scoreFields"></div>
    </div>
    <div class="result" id="scoreResult"></div>
    <div class="card"><p class="note" id="scoreNote"></p></div>
  </section>

  <!-- TAB4 임대료 -->
  <section class="panel" data-tab="rent" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">주택형</span>
        <div class="stepper" id="unit"></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보증금 ↔ 월세 전환 <span class="hint">100만원 단위 / 둘 중 하나만 입력</span></span>
        <div class="inline"><span class="unit">보증금 증액</span><input type="number" id="convUp" inputmode="numeric" value="0"><span class="unit">만원</span></div>
        <div class="inline" style="margin-top:10px"><span class="unit">보증금 감액</span><input type="number" id="convDown" inputmode="numeric" value="0"><span class="unit">만원</span></div>
        <p class="note" id="convLimit" style="margin-top:9px"></p>
      </label>
    </div>
    <div class="result" id="rentResult"></div>
    <div class="card">
      <div class="kv"><span class="k">기본 임대보증금</span><span class="v" id="baseDeposit">—</span></div>
      <div class="kv"><span class="k">기본 월임대료</span><span class="v" id="baseRent">—</span></div>
      <div class="kv"><span class="k">조정 후 보증금</span><span class="v" id="finalDeposit">—</span></div>
      <div class="kv"><span class="k">조정 후 월임대료</span><span class="v" id="finalRent">—</span></div>
      <div class="kv"><span class="k">계약금(보증금 10%)</span><span class="v" id="downpay">—</span></div>
      <div class="kv"><span class="k">잔금</span><span class="v" id="balance">—</span></div>
    </div>
    <div class="card"><p class="note" id="rentNote"></p></div>
  </section>

  <footer><div class="disclaimer" id="disclaimer"></div></footer>
</div>

<script>
/* ============================================================
   PARAMS — 서울공릉 신혼희망타운 행복주택 입주자모집공고
   (공고일 2026.07.29, 주택관리번호 2026000363) 원문 기준.
   행복주택은 분양이 아니라 임대 + 분양전환 없음.
   소득·자산 "이하" 자격 + 보증금/월세 전환 구조.
   ============================================================ */
const PARAMS = {
  complex: "서울공릉 신혼희망타운 행복주택",
  region: "서울특별시 노원구 공릉동 240-1",
  source: "LH 청약플러스 공고 2026.07.29, 관리번호 2026000363",
  moveIn: "2027.10 (예정)",

  income: {
    hhKeys: [2,3,4,5,6],
    // 공고 <가산적용 상세 소득기준> 표를 그대로. 단위 = 원/월.
    // 2인 100%는 공고에 "-"(미표기) — 2인은 최소 110%부터 적용된다.
    byPct: {
      100: {          3:8168429,  4:8802202,  5:9326985,  6:9906263  },
      110: { 2:6452897, 3:8985272,  4:9682422,  5:10259684, 6:10896889 },
      120: { 2:7039524, 3:9802115,  4:10562642, 5:11192382, 6:11887516 },
      130: { 2:7626151, 3:10618958, 4:11442863, 5:12125081, 6:12878142 },
      140: { 2:8212778, 3:11435801, 4:12323083, 5:13057779, 6:13868768 }
    },
    // 7인 이상: 6인 금액 + 1인당 579,278원
    extraPerPerson: 579278,
    kindLabel: { single:"신혼부부(외벌이)", dual:"신혼부부(맞벌이)", parent:"한부모가족" }
  },

  // 자산기준(원). 출산자녀수(’23.3.28 이후, 최대 2자녀)에 따라 가산.
  asset: {
    total: { 0:345000000, 1:379000000, 2:413000000 },
    car:   { 0:45420000,  1:49960000,  2:54510000  }
  },

  // 배점표 — 트랙마다 다르다. 일반공급(일반형)은 배점 없이 순위→추첨.
  score: {
    tracks: {
      pri: {
        label: "우선공급 (일반형)",
        intro: "노원구 거주자가 1순위, 노원구 외 서울시 거주자가 2순위입니다. <strong>2순위는 ② 청약통장 항목만</strong> 적용됩니다(만점 3점).",
        note: "우선공급 경쟁 시 선정순서: <strong>2세 미만 자녀가 있는 자 → 순위 → 배점 → 해당 순위 지역 거주기간이 오래인 자 → 추첨</strong>. 거주기간은 공고일 현재 주민등록표상 '계속하여' 등재된 기간만 인정됩니다(중간에 타 지역 전출 시 재전입일부터 재산정).",
        items: [
          { key:"resid", label:"거주지 및 거주기간", hint:"노원구 기준", options:[
            {label:"노원구 3년 이상 거주",points:3},
            {label:"노원구 3년 미만 거주",points:1},
            {label:"노원구 외 서울시 거주(2순위·미적용)",points:0}]},
          { key:"bank", label:"주택청약종합저축 납입횟수", hint:"청약통장 순위확인서 기준 회차", options:[
            {label:"가입 2년 경과 + 24회 이상 납입",points:3},
            {label:"가입 6개월 경과 + 6~23회 납입",points:1},
            {label:"6회 미만",points:0}]}
        ]
      },
      weak: {
        label: "주거약자용 주택 (우선·일반 공통)",
        intro: "주거약자용은 <strong>우선공급·일반공급 모두 배점</strong>을 적용합니다(만점 9점). 주거약자가 아닌 사람이 주거약자용에 청약하면 탈락 처리됩니다.",
        note: "주거약자 = 65세 이상 고령자, 장애인복지법상 장애인, 상이등급 1~7급 국가유공자·보훈보상대상자, 5·18민주화운동부상자(1~14급), 고엽제후유의증환자(경도 이상) 등. 선정순서는 <strong>순위 → 배점 → (우선공급은 거주기간) → 추첨</strong>. 중증장애인 배점은 장애인고용촉진법상 확인서를 제출해야 인정됩니다.",
        items: [
          { key:"family", label:"부양가족수", hint:"공급신청자 본인 제외·태아 포함", options:[
            {label:"3인 이상",points:3},{label:"2인",points:2},{label:"1인",points:1},{label:"없음",points:0}]},
          { key:"resid", label:"해당 주택건설지역 거주기간", hint:"서울특별시 계속 거주", options:[
            {label:"5년 이상",points:3},{label:"3년 이상 5년 미만",points:2},{label:"1년 이상 3년 미만",points:1},{label:"1년 미만",points:0}]},
          { key:"disab", label:"장애정도", hint:"", options:[
            {label:"중증장애인",points:3},{label:"그 외 장애인",points:1},{label:"해당 없음",points:0}]}
        ]
      },
      gen: {
        label: "일반공급 (일반형)",
        intro: "",
        note: "",
        items: [],
        rankOnly: true
      }
    },
    // 일반공급·주거약자 일반공급의 거주지 순위 (신청자 본인 또는 배우자 기준)
    ranks: [
      { v:1, label:"서울특별시 또는 연접지역", desc:"의정부·남양주·구리·하남·성남·과천·안양·광명·부천·인천·김포·고양·양주" },
      { v:2, label:"그 외 경기도", desc:"주택공급에 관한 규칙 제4조제3항 각호 지역 중 1순위 외" },
      { v:3, label:"그 외 지역", desc:"1·2순위에 해당하지 않는 경우" }
    ]
  },

  // 임대조건(원). 공고 <임대조건> 표. 계약금 10%.
  rent: {
    depositPct: 10,
    convUpRate: 3.5,     // 보증금 감액 → 월세 증가 시 이율 연 3.5%
    convDownRate: 6.0,   // 월임대료 → 보증금 증액 시 이율 연 6.0%
    convMaxUp: 99000000,   // 증액 한도
    convMaxDown: 178000000,// 감액 한도
    units: {

  $("income").addEventListener("input",renderIncome);

  /* 공고 <출생자녀 수에 따른 가산 소득·자산 기준> 표 그대로.
     한부모: 2인 0자녀 110 / 1자녀 120,  3인+ 0자녀 100 / 1자녀 110 / 2자녀+ 120
     외벌이: 2인 110, 3인 0자녀 100 / 1자녀 110, 4인+ 0자녀 100 / 1자녀 110 / 2자녀+ 120
     맞벌이: 2인 130, 3인 0자녀 120 / 1자녀 130, 4인+ 0자녀 120 / 1자녀 130 / 2자녀+ 140 */
  function pctFor(kind,n,kids){
    if(kind==="parent"){

  function capFor(pct,n){
