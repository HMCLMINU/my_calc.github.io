<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>증산역 이랜드 PEER DMC 청년안심주택 계산기</title>
<style>
  :root{
    --ink:#16233a;--ink-soft:#55617a;--line:#dfe3ec;--paper:#f7f6f2;--card:#fff;
    --seal:#b23a2e;--seal-soft:#f4e4e1;--gold:#b58a3c;--ok:#2f7d5b;--warn:#b07c1e;
    --s1:#2f6d8f;--s2:#5a8fa8;--s3:#94b3c4;
    --shadow:0 1px 2px rgba(22,35,58,.05),0 8px 24px rgba(22,35,58,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:radial-gradient(1200px 400px at 100% -10%,#efe9df 0%,transparent 60%),var(--paper);
    color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  header{margin-bottom:22px}
  .plate{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;font-weight:700;
    color:var(--seal);border:1.5px solid var(--seal);border-radius:2px;padding:4px 10px;background:var(--seal-soft)}
  h1{font-size:26px;line-height:1.25;margin:14px 0 6px;letter-spacing:-.02em;font-weight:800}
  h1 .accent{color:var(--seal)}
  .sub{color:var(--ink-soft);font-size:14px;margin:0}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 18px;background:#ecebe4;padding:5px;border-radius:12px}
  .tab{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;
    border-radius:8px;color:var(--ink-soft);background:transparent;transition:all .18s ease}
  .tab .n{display:block;font-size:9px;letter-spacing:.08em;opacity:.6;font-weight:800;margin-bottom:2px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .panel{display:none;animation:fade .25s ease}
  .panel[data-active="true"]{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  label.field{display:block;margin-bottom:16px}
  label.field:last-child{margin-bottom:0}
  .field .lab{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field .hint{color:var(--ink-soft);font-weight:500;font-size:12px}
  .stepper{display:flex;gap:8px;flex-wrap:wrap}
  .stepper button{flex:1 1 44px;min-width:44px;cursor:pointer;border:1px solid var(--line);background:#fbfbf9;
    border-radius:9px;font:inherit;font-weight:700;padding:9px 4px;color:var(--ink);transition:all .15s ease}
  .stepper button[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
  input[type=number],input[type=date]{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);
    border-radius:9px;background:#fbfbf9;color:var(--ink)}
  input:focus,.stepper button:focus-visible,.tab:focus-visible,select:focus{outline:2px solid var(--seal);outline-offset:1px}
  select{width:100%;font:inherit;font-weight:600;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfbf9;color:var(--ink)}
  .inline{display:flex;align-items:center;gap:8px}
  .inline input{text-align:right}
  .unit{color:var(--ink-soft);font-weight:700;font-size:13px;white-space:nowrap}
  .result{border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .result .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-soft);text-transform:uppercase}
  .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
  .big small{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .verdict{font-size:14px;font-weight:700}
  .verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.no{color:var(--seal)}
  .bar{height:12px;border-radius:99px;background:#ececec;overflow:hidden;margin:12px 0 6px}
  .bar>span{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .barscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-weight:700}
  .stages{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .stage{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;opacity:.5;transition:all .2s ease}
  .stage.hit{opacity:1;border-color:var(--ink);background:#fbfbf9}
  .stage .dot{width:10px;height:10px;border-radius:99px;flex:none}
  .stage b{font-weight:800}.stage .pct{margin-left:auto;font-weight:800;color:var(--ink-soft);font-size:12px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-soft);font-weight:600}.kv .v{font-weight:800;text-align:right}
  .kv.total .k{color:var(--ink)}.kv.total .v{color:var(--seal);font-size:16px}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.55}
  .note strong{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:#f2f1ec;color:var(--ink-soft)}
  .chip.on{background:var(--seal-soft);color:var(--seal)}
  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .disclaimer{font-size:11.5px;color:var(--ink-soft);line-height:1.6;background:#fbfaf6;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .disclaimer b{color:var(--seal)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="plate" id="plateText">🏠 청년안심주택 계산기</span>
    <h1>내 <span class="accent">신청자격·소득순위</span>와<br>실제 월 부담을 확인</h1>
    <p class="sub" id="subText"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="elig"><span class="n">1</span>신청자격</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="income"><span class="n">2</span>소득순위</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="asset"><span class="n">3</span>자산·차량</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="rent"><span class="n">4</span>임대료</button>
  </div>

  <!-- TAB1 신청자격 -->
  <section class="panel" data-tab="elig" data-active="true">
    <div class="card">
      <label class="field">
        <span class="lab">생년월일 <span class="hint">(공고일 기준 만 19~39세)</span></span>
        <input type="date" id="birth" value="1994-01-01">
      </label>
      <label class="field">
        <span class="lab">혼인 상태</span>
        <div class="stepper" id="marital">
          <button data-v="single" aria-pressed="true">미혼</button>
          <button data-v="newly">혼인 7년 이내</button>
          <button data-v="pre">예비신혼부부</button>
          <button data-v="over">혼인 7년 초과</button>
        </div>
      </label>
      <label class="field">
        <span class="lab">본인 주택 소유</span>
        <div class="stepper" id="ownSelf">
          <button data-v="0" aria-pressed="true">무주택</button>
          <button data-v="1">주택 있음</button>
        </div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">같은 세대원 중 주택 소유자 <span class="hint">(배우자·직계존비속 등)</span></span>
        <div class="stepper" id="ownFam">
          <button data-v="0" aria-pressed="true">없음</button>
          <button data-v="1">있음</button>
        </div>
      </label>
    </div>
    <div class="result" id="eligResult"></div>
    <div class="card"><p class="note" id="eligNote"></p></div>
  </section>

  <!-- TAB2 소득순위 -->
  <section class="panel" data-tab="income" data-active="false">
    <div class="card">
      <p class="note" style="margin-bottom:14px"><strong>소득 요건은 특별공급(청년 20형 55세대)에만 있습니다.</strong> 일반공급 216세대는 소득·자산·지역 요건이 없고 무작위 추첨입니다.</p>
      <label class="field">
        <span class="lab">해당 세대 가구원수 <span class="hint">(등본상 직계존비속 / 형제자매 소득 제외)</span></span>
        <div class="stepper" id="hh"></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">해당 세대 월평균 소득 <span class="hint">(세전 합산 / 만원)</span></span>
        <div class="inline"><input type="number" id="inc" inputmode="numeric" value="350"><span class="unit">만원 / 월</span></div>
      </label>
    </div>
    <div class="card">
      <label class="field" style="margin-bottom:0">
        <span class="lab">지역 순위 <span class="hint">거주지 또는 직장·대학 소재지</span></span>
        <div class="stepper" id="area">
          <button data-v="1" aria-pressed="true">서대문구</button>
          <button data-v="2">서울시</button>
          <button data-v="3">그 외</button>
        </div>
      </label>
    </div>
    <div class="result" id="incomeResult"></div>
    <div class="card">
      <p class="note"><strong>특별공급 선정 순서:</strong> 소득순위(100%→110%→120%) → 지역순위(서대문구→서울시→그 외) → 동일순위면 전산 추첨.</p>
      <div class="chips" id="incomeChips"></div>
    </div>
  </section>

  <!-- TAB3 자산·차량 -->
  <section class="panel" data-tab="asset" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">본인 자산 가액 <span class="hint">(특별공급만 적용 / 만원)</span></span>
        <div class="inline"><input type="number" id="asset" inputmode="numeric" value="10000"><span class="unit">만원</span></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보유 자동차 가액 <span class="hint">(이륜차 포함 · 없으면 0 / 만원)</span></span>
        <div class="inline"><input type="number" id="car" inputmode="numeric" value="0"><span class="unit">만원</span></div>
      </label>
    </div>
    <div class="result" id="assetResult"></div>
    <div class="card"><p class="note" id="assetNote"></p></div>
  </section>

  <!-- TAB4 임대료 -->
  <section class="panel" data-tab="rent" data-active="false">
    <div class="card">
      <label class="field">
        <span class="lab">공급유형 · 주택형</span>
        <div class="stepper" id="unit" style="flex-direction:column"></div>
      </label>
      <label class="field">
        <span class="lab">보증금 비율 <span class="hint">계약 이후 변경 불가 · 50% 초과 전환 불가</span></span>
        <div class="stepper" id="ratio"></div>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lab">보증금 대출 <span class="hint">(대출액·연이율 입력 / 이자만 월 부담에 합산)</span></span>
        <div class="inline"><span class="unit">대출액</span><input type="number" id="loan" inputmode="numeric" value="0"><span class="unit">만원</span></div>
        <div class="inline" style="margin-top:10px"><span class="unit">연이율</span><input type="number" id="rate" inputmode="decimal" step="0.1" value="2.5"><span class="unit">%</span></div>
      </label>
    </div>
    <div class="result" id="rentResult"></div>
    <div class="card" id="rentBreak"></div>
    <div class="card"><p class="note" id="rentNote"></p></div>
  </section>

  <footer><div class="disclaimer" id="disclaimer"></div></footer>
</div>

<script>
/* ============================================================
   PARAMS — 증산역 청년안심주택 이랜드 PEER DMC
   최초 입주자 모집공고(2026.07.28) 원문 기준.
   공공지원 민간임대(임대형) → 분양가·모기지 없음. 보증금/월세 전환 구조.
   배점표 없음 → 특별공급은 소득순위→지역순위→추첨, 일반공급은 무작위 추첨.
   ============================================================ */
const PARAMS = {
  complex: "증산역 청년안심주택 이랜드 PEER DMC",
  type: "공공지원 민간임대 (서울시 청년안심주택)",
  region: "서울 서대문구 북가좌동 333-1 · 6호선 증산역 1번 출구 250m",
  source: "최초 입주자 모집공고 2026.07.28",
  announceDate: "2026.07.28",
  ageFrom: "1986-07-29",   // 만 39세 하한 (공고 명시)
  ageTo:   "2007-07-28",   // 만 19세 상한 (공고 명시)
  carCap: 45420000,        // 자동차가액 4,542만원 (전 유형 공통)
  assetCap: 251000000,     // 특별공급 청년 본인 자산 2억5,100만원

  // 전년도 도시근로자 가구원수별 가구당 월평균소득(원). 공고 표 그대로.
  income: {
    hhKeys: [1,2,3,4,5],
    table: {
      1: {100:3813363, 110:4194699, 120:4576036},
      2: {100:5866270, 110:6452897, 120:7039524},
      3: {100:8168429, 110:8985272, 120:9802115},
      4: {100:8802202, 110:9682422, 120:10562642},
      5: {100:9326985, 110:10259684, 120:11192382}
    },
    perExtra: 579278,  // 6인 이상: 5인 소득 + 1인당 579,278원
    areaLabel: {1:"1순위 서대문구", 2:"2순위 서울시", 3:"3순위 그 외 지역"}
  },

  supplyTotal: {all:382, private:271, special:55, general:216, publicSH:111},

  // 임대조건(원). 공고 <임대보증금 및 월 임대료> 표. 계약금 = 보증금 10%.
  rent: {
    depositPct: 10,
    ratios: [50,40,30],
    ratioLabel: {50:"표준형 50%", 40:"선택형2 40%", 30:"선택형1 30%"},
    units: [
      { id:"sp20", label:"특별공급 청년 · 20형", tenant:"청년", group:"special", count:55,
        area:20.5025, mgmt:69000,
        d:{50:82000000, 40:66000000, 30:49000000}, r:{50:340000, 40:410000, 30:480000} },
      { id:"gy20", label:"일반공급 청년 · 20형", tenant:"청년", group:"general", count:80,
        area:20.5025, mgmt:69000,
        d:{50:100000000, 40:80000000, 30:60000000}, r:{50:410000, 40:490000, 30:580000} },
      { id:"gy46", label:"일반공급 청년 · 46형", tenant:"청년", group:"general", count:14,
        area:46.3766, mgmt:153000,
        d:{50:202000000, 40:162000000, 30:121000000}, r:{50:770000, 40:920000, 30:1080000} },
      { id:"gn46", label:"일반공급 신혼부부 · 46형", tenant:"신혼부부", group:"general", count:15,
        area:46.3766, mgmt:153000,
        d:{50:202000000, 40:162000000, 30:121000000}, r:{50:770000, 40:920000, 30:1080000} },
      { id:"gn59", label:"일반공급 신혼부부 · 59형", tenant:"신혼부부", group:"general", count:107,
        area:59.9065, mgmt:198000,
        d:{50:252000000, 40:201000000, 30:151000000}, r:{50:960000, 40:1150000, 30:1340000} }
    ]
  },

  schedule: [
    ["모집공고", "2026.07.28(화)"],
    ["인터넷 청약", "2026.08.07(금) 09:00 ~ 08.11(화) 17:00"],
    ["당첨자·동호수 발표", "2026.08.12(수) 11:00"],
    ["서류 제출(이메일)", "2026.08.13(목) ~ 08.17(월)"],
    ["계약 체결", "2026.08.24(월) ~ 08.28(금)"],
    ["입주지정기간(예정)", "2026.10월 중"]
  ]
};
/* ===================== PARAMS 끝 ===================== */

(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  function wonText(won){
    const m = won/10000, eok = Math.floor(m/10000), rest = Math.round(m%10000);
    if(eok>0) return eok+"억 "+(rest>0? comma(rest)+"만원" : "");
    return comma(Math.round(m))+"만원";
  }

  $("plateText").textContent = "🏠 청년안심주택 계산기";
  $("subText").textContent = PARAMS.complex+" · "+PARAMS.region;
  $("disclaimer").innerHTML =
    "<b>안내</b> · 기준 수치는 <b>"+PARAMS.complex+"</b> "+PARAMS.source+" 원문 기준입니다. "
    + "공공지원 민간임대는 <b>분양전환되지 않는</b> 임대주택으로, 임대차 2년 단위 갱신·최대 10년 거주입니다. "
    + "갱신 시 임대료는 5% 범위 내에서 증액될 수 있습니다. 자격·금액·일정은 공고문과 홍보관(1551-8970)에서 반드시 재확인하세요. "
    + "본 계산은 참고용 추정치입니다.";

  const tabs = document.querySelectorAll(".tab"), panels = document.querySelectorAll(".panel");
  tabs.forEach(t => t.addEventListener("click", () => {
    tabs.forEach(x => x.setAttribute("aria-selected", x===t ? "true":"false"));
    panels.forEach(p => p.setAttribute("data-active", p.dataset.tab===t.dataset.tab ? "true":"false"));
  }));
  function stepper(id, cb){
    const box = $(id); if(!box) return;
    box.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b ? "true":"false"));
      cb(b.dataset.v);
    });
  }

  // ===== 공유 상태 =====
  let marital="single", ownSelf=0, ownFam=0;
  let hh=1, area=1;

  // ===== TAB1 신청자격 =====
  stepper("marital", v => { marital=v; renderElig(); renderIncome(); renderAsset(); });
  stepper("ownSelf", v => { ownSelf=+v; renderElig(); });
  stepper("ownFam",  v => { ownFam=+v;  renderElig(); });
  $("birth").addEventListener("input", renderElig);

  function ageOK(){
    const b = $("birth").value;
    if(!b) return null;
    return (b >= PARAMS.ageFrom && b <= PARAMS.ageTo);
  }
  function carOK(){ return (+$("car").value||0)*10000 <= PARAMS.carCap; }

  function renderElig(){
    const aOK = ageOK();
    const cOK = carOK();
    const rows = [];

    // 특별공급 청년 (미혼 + 무주택 + 소득/자산 요건 별도 탭)
    const spPass = aOK && marital==="single" && !ownSelf && !ownFam && cOK;
    rows.push({name:"특별공급 청년", type:"20형 55세대", pass:spPass, color:"var(--seal)",
      why: !aOK ? "만 19~39세 아님" : marital!=="single" ? "미혼만 신청 가능"
           : ownSelf ? "본인 주택 보유" : ownFam ? "세대원 주택 보유(해당 세대 무주택 요건)"
           : !cOK ? "자동차가액 초과" : "소득 120%↓·자산 2.51억↓ 확인 필요"});

    // 일반공급 청년 (미혼 + 본인 무주택, 세대원 소유 무관)
    const gyPass = aOK && marital==="single" && !ownSelf && cOK;
    rows.push({name:"일반공급 청년", type:"20·46형 94세대", pass:gyPass, color:"var(--s1)",
      why: !aOK ? "만 19~39세 아님" : marital!=="single" ? "미혼만 신청 가능"
           : ownSelf ? "본인 주택 보유" : !cOK ? "자동차가액 초과" : "소득·자산·지역 요건 없음"});

    // 일반공급 신혼부부
    const isNewly = (marital==="newly" || marital==="pre");
    const gnPass = aOK && isNewly && !ownSelf && (marital==="pre" ? true : !ownFam) && cOK;
    rows.push({name:"일반공급 신혼부부", type:"46·59형 122세대", pass:gnPass, color:"var(--s2)",
      why: !aOK ? "신청자 만 19~39세 아님(배우자 무관)" : !isNewly ? "혼인 7년 이내 또는 예비신혼부부만"
           : ownSelf ? "본인 주택 보유" : (marital==="newly" && ownFam) ? "무주택세대구성원 요건 미충족"
           : !cOK ? "자동차가액 초과" : "소득·자산·지역 요건 없음"});

    const okCount = rows.filter(r=>r.pass).length;
    const head = okCount>0
      ? `<div class="big">신청 가능 ${okCount}개 유형</div><div class="verdict ok">✓ 아래 유형으로 청약할 수 있어요</div>`
      : `<div class="big">신청 가능 유형 없음</div><div class="verdict no">✗ 조건을 다시 확인해 주세요</div>`;

    $("eligResult").innerHTML =
      `<div class="eyebrow">공고일 2026.07.28 기준 자격 판정</div>` + head
      + `<div class="stages">`
      + rows.map(r => `<div class="stage ${r.pass?"hit":""}">`
          + `<span class="dot" style="background:${r.pass?r.color:"#ccc"}"></span>`
          + `<span><b>${r.name}</b> · ${r.type}<br><span class="note">${r.pass?"→ "+r.why:"× "+r.why}</span></span>`
          + `<span class="pct">${r.pass?"가능":"불가"}</span></div>`).join("")
      + `</div>`;

    $("eligNote").innerHTML =
      "<strong>1인 1주택형만 청약 가능</strong>합니다. 두 건 이상 신청하면 전부 무효 처리되고, 신혼부부는 부부 중 1명만 대표로 신청합니다.<br><br>"
      + "청년 계층은 <strong>본인 1인만</strong> 입주·전입신고가 가능하고, 신혼부부 계층은 본인·배우자·직계비속만 가능합니다. "
      + "제3자 동거가 확인되면 즉시 퇴거·계약해지 사유입니다.<br><br>"
      + "<strong>무주택 범위 유의</strong>: 공고 개요에는 '신청자 및 입주예정 세대원 전부 무주택'으로 적혀 있고, "
      + "일반공급 청년 항목에는 '본인만 무주택이면 세대원 주택 소유 무관'으로 적혀 있습니다. "
      + "본 계산기는 두 조건을 나눠 표시했으니, 세대원이 주택을 보유한 경우 홍보관(1551-8970)에 반드시 확인하세요.<br><br>"
      + "성범죄 또는 금고 이상 형 이력이 있으면 청약이 불가하며, 적발 시 당첨 취소·퇴거 조치됩니다.";
  }

  // ===== TAB2 소득순위 =====
  $("hh").innerHTML = PARAMS.income.hhKeys.map((n,i)=>`<button data-v="${n}"${i===0?' aria-pressed="true"':''}>${n}인</button>`).join("")
    + `<button data-v="6">6인</button>`;
  stepper("hh", v => { hh=+v; renderIncome(); });
  stepper("area", v => { area=+v; renderIncome(); });
  $("inc").addEventListener("input", renderIncome);

  function capFor(n, pct){
    const t = PARAMS.income.table;
    if(t[n]) return t[n][pct];
    const extra = (n-5) * PARAMS.income.perExtra;
    return t[5][pct] + extra;   // 6인 이상 가산
  }

  function renderIncome(){
    const inc = (+$("inc").value||0)*10000;
    const c100 = capFor(hh,100), c110 = capFor(hh,110), c120 = capFor(hh,120);
    let rank=0;
    if(inc>0 && inc<=c100) rank=1; else if(inc<=c110 && inc>0) rank=2; else if(inc<=c120 && inc>0) rank=3;

    const fill = Math.min(100, c120 ? inc/c120*100 : 0);
    let verdict, cls;
    if(inc<=0){ verdict="소득을 입력하세요"; cls=""; }
    else if(rank===0){ verdict="✗ 특별공급 소득 상한(120%) 초과 — 일반공급은 신청 가능"; cls="no"; }
    else { verdict="✓ 특별공급 소득 "+rank+"순위"; cls = rank===1?"ok":"warn"; }

    const stages = [[1,"100% 이하",c100],[2,"110% 이하",c110],[3,"120% 이하",c120]].map(s =>
      `<div class="stage ${rank===s[0]?"hit":""}">`
      + `<span class="dot" style="background:${rank===s[0]?"var(--seal)":"#ccc"}"></span>`
      + `<span><b>${s[0]}순위</b> · 기준소득 ${s[1]}</span>`
      + `<span class="pct">${wonText(s[2])}</span></div>`).join("");

    $("incomeResult").innerHTML =
      `<div class="eyebrow">${hh}인 가구 · 특별공급 소득 상한 (120%)</div>`
      + `<div class="big">${wonText(c120)} <small>/ 월</small></div>`
      + `<div class="verdict ${cls}">${verdict}</div>`
      + `<div class="bar"><span style="width:${fill.toFixed(0)}%;background:${rank?"var(--ok)":"var(--seal)"}"></span></div>`
      + `<div class="barscale"><span>0</span><span>100% ${wonText(c100)}</span><span>120% ${wonText(c120)}</span></div>`
      + `<div class="stages">${stages}</div>`
      + `<div class="note" style="margin-top:12px">지역순위: <strong>${PARAMS.income.areaLabel[area]}</strong>`
      + (rank? ` → 최종 <strong>소득 ${rank}순위 · 지역 ${area}순위</strong>` : ``)
      + `</div>`;

    $("incomeChips").innerHTML =
      [`1인 100% ${wonText(capFor(1,100))}`, `2인 100% ${wonText(capFor(2,100))}`,
       `3인 100% ${wonText(capFor(3,100))}`, `6인 이상은 5인 + 1인당 ${comma(PARAMS.income.perExtra)}원`]
      .map(t=>`<span class="chip">${t}</span>`).join("")
      + (marital!=="single" ? `<span class="chip on">미혼이 아니면 특별공급 신청 불가 — 일반공급 신혼부부로</span>` : ``);
  }

  // ===== TAB3 자산·차량 =====
  ["asset","car"].forEach(id => $(id).addEventListener("input", () => { renderAsset(); renderElig(); }));
  function renderAsset(){
    const asset = (+$("asset").value||0)*10000, car = (+$("car").value||0)*10000;
    const passA = asset <= PARAMS.assetCap, passC = car <= PARAMS.carCap;
    const spOK = passA && passC;
    $("assetResult").innerHTML =
      `<div class="eyebrow">자산·자동차 기준</div>`
      + `<div class="big">${spOK?"✓ 특별공급 통과":(passC?"✗ 자산 초과":"✗ 자동차가액 초과")}</div>`
      + `<div class="verdict ${spOK?"ok":"no"}">본인 자산 ${passA?"통과":"초과"} · 자동차 ${passC?"통과":"초과"}</div>`
      + `<div class="kv" style="margin-top:12px"><span class="k">본인 자산 상한 (특별공급)</span><span class="v">${wonText(PARAMS.assetCap)}</span></div>`
      + `<div class="kv"><span class="k">자동차가액 상한 (전 유형)</span><span class="v">${wonText(PARAMS.carCap)}</span></div>`
      + `<div class="note" style="margin-top:10px">${passC
          ? "자동차 요건은 일반공급에도 적용됩니다. 자동차가액 4,542만원 이내면 소유·운행이 가능합니다."
          : "<strong>자동차가액이 상한을 넘으면 특별공급·일반공급 모두 신청할 수 없습니다.</strong>"}</div>`;
    $("assetNote").innerHTML =
      "일반공급(청년 94세대·신혼부부 122세대)은 <strong>자산 요건이 없습니다.</strong> 자동차가액 4,542만원 기준만 지키면 됩니다.<br><br>"
      + "자동차가액은 보험개발원 또는 복지로 포털에서 조회하며, 이륜차도 포함됩니다. "
      + "무주택·자동차가액 요건은 최초 계약뿐 아니라 <strong>갱신계약 때도 계속 유지</strong>해야 합니다.<br><br>"
      + "단지 주차는 총 247대이며 세대당 1대만 등록 가능하고, 입주자 일반 주차는 월 105,000원(장애인·국가유공자 32,500원)입니다. "
      + "주차면 부족 시 등록이 제한될 수 있습니다.";
  }

  // ===== TAB4 임대료 =====
  $("unit").innerHTML = PARAMS.rent.units.map((u,i)=>
    `<button data-v="${u.id}"${i===0?' aria-pressed="true"':''} style="flex:1 1 100%;text-align:left;padding:11px 13px">${u.label} <span style="font-weight:600;opacity:.6">(${u.count}세대)</span></button>`).join("");
  $("ratio").innerHTML = PARAMS.rent.ratios.map((r,i)=>
    `<button data-v="${r}"${i===0?' aria-pressed="true"':''}>${PARAMS.rent.ratioLabel[r]}</button>`).join("");

  let unitId = PARAMS.rent.units[0].id, ratio = PARAMS.rent.ratios[0];
  stepper("unit", v => { unitId=v; renderRent(); });
  stepper("ratio", v => { ratio=+v; renderRent(); });
  ["loan","rate"].forEach(id => $(id).addEventListener("input", renderRent));

  function renderRent(){
    const u = PARAMS.rent.units.find(x=>x.id===unitId);
    const deposit = u.d[ratio], rent = u.r[ratio];
    const down = deposit * PARAMS.rent.depositPct/100;
    const balance = deposit - down;
    const loan = (+$("loan").value||0)*10000;
    const rateV = +$("rate").value||0;
    const interest = loan * (rateV/100) / 12;
    const monthly = rent + u.mgmt + interest;
    const ownCash = Math.max(0, deposit - loan);

    $("rentResult").innerHTML =
      `<div class="eyebrow">${u.label} · 보증금 ${ratio}%</div>`
      + `<div class="big">${comma(monthly)}<small> 원 / 월</small></div>`
      + `<div class="verdict ok">보증금 ${wonText(deposit)} · 월임대료 ${comma(rent)}원</div>`
      + `<div class="note" style="margin-top:10px">월 부담 = 월임대료 ${comma(rent)}원 + 공용관리비 ${comma(u.mgmt)}원`
      + (interest>0 ? ` + 보증금 대출이자 ${comma(interest)}원` : ``)
      + `. 전기·수도·가스는 사용량대로 별도 부과되고, 관리비는 VAT 별도입니다.</div>`;

    $("rentBreak").innerHTML =
      `<div class="kv"><span class="k">임대보증금</span><span class="v">${wonText(deposit)}</span></div>`
      + `<div class="kv"><span class="k">계약금 (보증금 10%)</span><span class="v">${wonText(down)}</span></div>`
      + `<div class="kv"><span class="k">잔금 (입주 전 납부)</span><span class="v">${wonText(balance)}</span></div>`
      + `<div class="kv"><span class="k">보증금 대출</span><span class="v">${loan>0? wonText(loan) : "없음"}</span></div>`
      + `<div class="kv"><span class="k">실제 필요 현금</span><span class="v">${wonText(ownCash)}</span></div>`
      + `<div class="kv"><span class="k">월임대료</span><span class="v">${comma(rent)}원</span></div>`
      + `<div class="kv"><span class="k">공용관리비 추정 (VAT 별도)</span><span class="v">${comma(u.mgmt)}원</span></div>`
      + (interest>0 ? `<div class="kv"><span class="k">대출이자 (연 ${rateV}%)</span><span class="v">${comma(interest)}원</span></div>` : ``)
      + `<div class="kv total"><span class="k">월 총 부담</span><span class="v">${comma(monthly)}원</span></div>`
      + `<div class="kv"><span class="k">전용면적</span><span class="v">${u.area}㎡</span></div>`;

    const other = PARAMS.rent.ratios.filter(r=>r!==ratio)
      .map(r=>`${PARAMS.rent.ratioLabel[r]} → 보증금 ${wonText(u.d[r])} / 월 ${comma(u.r[r])}원`).join("<br>");
    $("rentNote").innerHTML =
      `<strong>같은 주택형의 다른 비율</strong><br>${other}<br><br>`
      + `보증금 비율은 30·40·50% 단위로만 전환할 수 있고 <strong>계약 이후에는 변경할 수 없습니다.</strong> `
      + `보증보험 가입액 사유로 50% 초과 전환도 불가합니다.<br><br>`
      + `잔금은 실입주일 또는 입주지정기간 종료일 중 먼저 오는 날까지 납부해야 하며, 미납 시 계약 취소 및 위약금 100만원이 발생합니다. `
      + `보증수수료는 임대사업자 75% / 임차인 25% 부담으로 입주 후 별도 발생합니다.<br><br>`
      + `<strong>청약 일정</strong><br>` + PARAMS.schedule.map(s=>`${s[0]} — ${s[1]}`).join("<br>");
  }

  renderElig(); renderIncome(); renderAsset(); renderRent();
})();
</script>
</body>
</html>
